<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="logo-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logo-title">Barbearia Navalha</title>
  <rect width="640" height="200" rx="16" fill="#1C1C1C"/>

  <!-- emblema: anel dourado + navalha aberta -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#B8862B" stroke-width="4"/>
  <circle cx="100" cy="100" r="53" fill="none" stroke="#B8862B" stroke-width="1" opacity="0.6"/>
  <g transform="translate(46 46) scale(1.08) rotate(-35 50 50)">
    <rect x="4" y="43" width="42" height="13" rx="6.5" fill="#B8862B"/>
    <path d="M44 38 H88 Q96 38 96 45 Q96 50 91 51 H44 Z" fill="#F5F0E8"/>
    <circle cx="44" cy="47" r="3.6" fill="#1C1C1C"/>
  </g>

  <!-- nome -->
  <text x="190" y="92" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="700" fill="#F5F0E8" letter-spacing="2">Navalha</text>
  <line x1="192" y1="112" x2="560" y2="112" stroke="#B8862B" stroke-width="2"/>
  <text x="192" y="142" font-family="'Inter', Arial, Helvetica, sans-serif"
        font-size="22" font-weight="500" fill="#B8862B" letter-spacing="9">BARBEARIA</text>
</svg>
